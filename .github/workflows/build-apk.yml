name: Build APK

# 手动触发编译 APK
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型 (debug / release)
        required: true
        type: choice
        default: release
        options:
          - release
          - debug
      clean:
        description: 构建前清理
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 7.3.3

      - name: Generate debug keystore
        # 仓库未提交 TVBoxOSC.jks，CI 上用相同别名/密码生成一份自签名密钥库
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/TVBoxOSC.jks" ]; then
            echo "Keystore not found, generating a self-signed one..."
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/TVBoxOSC.jks" \
              -alias TVBoxOSC \
              -storepass TVBoxOSC \
              -keypass TVBoxOSC \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -dname "CN=TVBoxOSC, OU=Dev, O=TVBox, L=CI, ST=GitHub, C=CN"
          fi
          ls -la "$GITHUB_WORKSPACE/TVBoxOSC.jks"

      - name: Fix keystore path for Linux
        # app/build.gradle 使用 Windows 反斜杠路径 ..\\TVBoxOSC.jks，Linux 下需修正为正斜杠
        run: |
          sed -i 's|\.\.\\\\TVBoxOSC.jks|../TVBoxOSC.jks|g' app/build.gradle
          sed -i 's|\.\.\\TVBoxOSC.jks|../TVBoxOSC.jks|g' app/build.gradle
          echo "--- app/build.gradle signingConfigs ---"
          grep -n -A 5 "signingConfigs" app/build.gradle || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean before build
        if: ${{ github.event.inputs.clean == 'true' }}
        run: ./gradlew clean

      - name: Build ${{ github.event.inputs.build_type }} APK
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --build-cache --parallel --warning-mode all
          else
            ./gradlew assembleDebug --build-cache --parallel --warning-mode all
          fi

      - name: Collect APK
        run: |
          mkdir -p ${{ github.workspace }}/apk
          for f in $(find . -name "*.apk" -type f); do
            cp -v "$f" ${{ github.workspace }}/apk/
          done
          ls -la ${{ github.workspace }}/apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBox-${{ github.event.inputs.build_type }}-${{ github.run_id }}
          path: ${{ github.workspace }}/apk/*.apk
          if-no-files-found: error
          retention-days: 14
